# ============================================
# inventario.instelec-electric.com
# ============================================
server {
    listen 443 ssl http2;
    server_name inventario.instelec-electric.com;

    # Certificados SSL
    ssl_certificate /etc/letsencrypt/live/inventario.instelec-electric.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inventario.instelec-electric.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Proxy al contenedor de inventory-web (puerto 4002)
    location / {
        proxy_pass http://172.17.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# Redirigir HTTP a HTTPS
server {
    listen 80;
    server_name inventario.instelec-electric.com;
    return 301 https://$host$request_uri;
}
