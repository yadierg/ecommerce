# ============================================
# HTTP → HTTPS redirect + ACME challenge
# ============================================
server {
    listen 80;
    listen [::]:80;
    server_name admin.instelec-electric.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================
# HTTPS → admin-web (contenedor)
# ============================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.instelec-electric.com;

    ssl_certificate /etc/letsencrypt/live/admin.instelec-electric.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.instelec-electric.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/admin.instelec-electric.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 20M;

    location / {
        proxy_pass http://admin-web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
