# ============================================
# UPSTREAMS (nombres de servicios Docker)
# ============================================
upstream admin_api {
    server admin-api:3004;
    keepalive 32;
}

upstream store_api {
    server store-api:3001;
    keepalive 32;
}

upstream budget_api {
    server budget-api:3003;
    keepalive 32;
}

upstream inventory_api {
    server inventory-api:3002;
    keepalive 32;
}

# ============================================
# HTTP → HTTPS redirect + ACME challenge
# ============================================
server {
    listen 80;
    listen [::]:80;
    server_name api.instelec-electric.com;

    # ACME challenge (Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================
# API HTTPS
# ============================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.instelec-electric.com;

    # SSL (montado desde el host)
    ssl_certificate /etc/letsencrypt/live/api.instelec-electric.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.instelec-electric.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/api.instelec-electric.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    client_max_body_size 20M;

    # ============================================
    # ADMIN API → /admin/*
    # ============================================
    location /admin/ {
        limit_req zone=api_limit burst=200 nodelay;
        rewrite ^/admin/(.*)$ /$1 break;
        proxy_pass http://admin_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ============================================
    # STORE API → /store/*
    # ============================================
    location /store/ {
        limit_req zone=api_limit burst=200 nodelay;
        rewrite ^/store/(.*)$ /$1 break;
        proxy_pass http://store_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /store/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://store_api/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ============================================
    # BUDGET API → /budget/*
    # ============================================
    location /budget/ {
        limit_req zone=api_limit burst=200 nodelay;
        rewrite ^/budget/(.*)$ /$1 break;
        proxy_pass http://budget_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================
    # INVENTORY API → /inventory/*
    # ============================================
    location /inventory/ {
        limit_req zone=api_limit burst=200 nodelay;
        rewrite ^/inventory/(.*)$ /$1 break;
        proxy_pass http://inventory_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================
    # HEALTH
    # ============================================
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}