name: CI

on:
  push:
    branches: [main, develop*]
  pull_request:
    branches: [main, develop*]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # JOB 1: TEST & COVERAGE
  # ============================================
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-
            nx-${{ runner.os }}-

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # ============================================
  # JOB 2: DEPLOY TO VPS (Solo cuando hay push a main)
  # ============================================
  deploy:
    name: Deploy to VPS
    needs: test
    runs-on: ubuntu-latest
    # 👇 IMPORTANTE: Solo despliega si es un PUSH a la rama MAIN
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: 🔐 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22229 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: 🚀 Deploy via SSH
        run: |
          ssh -p 22229 -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            echo "🔄 Iniciando deploy del backend en producción..."
            cd /var/www/ecommerce
            
            # Actualizar a la rama main en el VPS
            git checkout main
            git pull origin main
            
            # Ejecutar script de despliegue
            ./deploy.sh
          EOF